[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-university-attendance-backend"
version = "1.0.0"
description = "Backend API for a Smart University Attendance Management System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "psycopg[binary]>=3.1,<4",
    "bcrypt>=4.1,<6",
    "pyjwt>=2.9,<3",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "email-validator>=2.1,<3",
    "qrcode[pil]>=7.4,<9",
    "pillow>=10",
    "openpyxl>=3.1,<4",
    "reportlab>=4.1",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27,<1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
ignore_missing_imports = true
follow_untyped_imports = true
